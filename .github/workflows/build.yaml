# Keep the name of this file. Audio Plugin Soko-kun records the workflow that signed the attestations of the first
# listed release, and a release signed by a workflow with another path is held for an administrator.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Change these with the values at the top of CMakeLists.txt.
  PRODUCT_NAME: Simple Denoise
  ARCHIVE_PREFIX: simple-denoise

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Runner images are pinned, so a new image does not change the build without a change here (hermetic-build).
          - os: windows-2022
            platform: windows-x64
            configure: -A x64
            # The Windows runner has python but not python3.
            python: python
            pluginval_exe: pluginval.exe
            validator_exe: clap-validator.exe
          - os: ubuntu-24.04
            platform: linux-x86_64
            configure: -DCMAKE_BUILD_TYPE=Release
            python: python3
            pluginval_exe: pluginval
            validator_exe: clap-validator
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        env:
          CONFIGURE: ${{ matrix.configure }}
        run: cmake -B build ${CONFIGURE}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      # The validators below test the files in dist/, which are the files that go into the archive.
      - name: Package
        id: package
        env:
          PLATFORM: ${{ matrix.platform }}
          PYTHON: ${{ matrix.python }}
        run: |
          version=$(sed -nE 's/^project\([^ ]+ VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
          cmake --install build --config Release --prefix dist
          name="${ARCHIVE_PREFIX}-${version}-${PLATFORM}.zip"
          (cd dist && cmake -E tar cf "../${name}" --format=zip -- *)
          "${PYTHON}" -I .github/scripts/check-archive.py "${name}" "${PLATFORM}" "${PRODUCT_NAME}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "name=${name}" >> "${GITHUB_OUTPUT}"

      - name: Download pluginval and clap-validator
        env:
          PLATFORM: ${{ matrix.platform }}
        run: bash .github/scripts/fetch-validators.sh "${RUNNER_TEMP}/validators" "${PLATFORM}"

      # pluginval is a GUI application. On Linux it runs under Xvfb, which provides a virtual display.
      - name: Install Xvfb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth

      # pluginval 2 embeds the VST 3 SDK validator and runs it at strictness level 5 and above (ci-plugin-validation).
      - name: Validate VST 3 with pluginval
        env:
          PLUGINVAL_EXE: ${{ matrix.pluginval_exe }}
        run: |
          pluginval=$(find "${RUNNER_TEMP}/validators/pluginval" -name "${PLUGINVAL_EXE}" -type f | head -n 1)
          set -- "${pluginval}" validate --strictness-level 10 --output-dir "${RUNNER_TEMP}/pluginval-logs" \
            "dist/VST3/${PRODUCT_NAME}.vst3"
          if [ "${RUNNER_OS}" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1280x800x24" "$@"
          else
            "$@"
          fi

      - name: Validate CLAP with clap-validator
        env:
          VALIDATOR_EXE: ${{ matrix.validator_exe }}
        run: |
          validator=$(find "${RUNNER_TEMP}/validators/clap-validator" -name "${VALIDATOR_EXE}" -type f | head -n 1)
          chmod +x "${validator}"
          "${validator}" validate "dist/CLAP/${PRODUCT_NAME}.clap"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.platform }}
          path: ${{ steps.package.outputs.name }}
          if-no-files-found: error
    outputs:
      version: ${{ steps.package.outputs.version }}

  # The unit tests under AddressSanitizer and UndefinedBehaviorSanitizer.
  sanitize:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DPLUGIN_SANITIZE=ON
          cmake --build build --parallel --target plugin-test
          ./build/plugin-test

  # On a tag: attest every release file and create a draft release whose notes are the message of the annotated tag.
  # Check the draft, verify the attestations, and then publish it by hand.
  release:
    needs: [build, sanitize]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check that the tag matches the version
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ "${TAG}" != "v${VERSION}" ]; then
            echo "Tag ${TAG} does not match version ${VERSION} in CMakeLists.txt"
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          merge-multiple: true

      - name: List release files
        run: sha256sum "${ARCHIVE_PREFIX}"-*.zip > "${RUNNER_TEMP}/release-checksums.txt"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/release-checksums.txt

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # gh release create cannot combine --notes-from-tag with --repo, and this job has no checkout,
        # so the notes are read from the annotated tag through the API.
        run: |
          read -r type sha < <(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.type + " " + .object.sha')
          if [ "${type}" != tag ]; then
            echo "${TAG} is not an annotated tag; its annotation becomes the release notes"
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.message' > "${RUNNER_TEMP}/release-notes.md"
          gh release create "${TAG}" "${ARCHIVE_PREFIX}"-*.zip --repo "${GITHUB_REPOSITORY}" --draft --verify-tag \
            --title "${TAG}" --notes-file "${RUNNER_TEMP}/release-notes.md"
